<script>
  // 1. Dynamic Environment Detection
  const detectEnv = (function() {
    let cartUrl = "/cart/";
    let ajaxEndpoint = "";
    let siteBase = "";

    if (typeof wc_add_to_cart_params !== 'undefined') {
      if (wc_add_to_cart_params.cart_url) cartUrl = wc_add_to_cart_params.cart_url;
      if (wc_add_to_cart_params.wc_ajax_url) {
        ajaxEndpoint = wc_add_to_cart_params.wc_ajax_url.replace('%%endpoint%%', 'add_to_cart');
      }
      if (wc_add_to_cart_params.ajax_url) {
        siteBase = wc_add_to_cart_params.ajax_url.split('/wp-admin')[0];
      }
    }

    if (!siteBase) {
      const match = window.location.pathname.match(/^(\/[^\/]+\/[^\/]+)/);
      siteBase = window.location.origin + (match ? match[1] : "");
    }

    if (!ajaxEndpoint) ajaxEndpoint = siteBase + "/?wc-ajax=add_to_cart";
    if (cartUrl === "/cart/" && siteBase) cartUrl = siteBase + "/cart/";

    const toastLink = document.getElementById('detect-toast-cart-link');
    if (toastLink) toastLink.href = cartUrl;

    return { siteBase: siteBase, ajaxEndpoint: ajaxEndpoint, cartUrl: cartUrl };
  })();

  // 2. Accurate Price Formatter with Safeguard against Corrupted DB Numbers
  function formatDetectPrice(item) {
    if (item.prices && item.prices.price) {
      let rawStr = String(item.prices.price);
      // Safeguard against astronomical corrupted strings (e.g. 1872150187215017379945775104)
      if (rawStr.length > 7) {
        return "AED Contact";
      }

      let raw = parseFloat(rawStr);
      const minor = (typeof item.prices.currency_minor_unit === 'number') ? item.prices.currency_minor_unit : 0;
      if (minor > 0) raw = raw / Math.pow(10, minor);

      if (raw > 50000) return "AED Contact";

      const formatted = Number.isInteger(raw)
        ? raw.toLocaleString('en-US')
        : raw.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

      if (item.prices.regular_price && item.prices.sale_price && item.prices.regular_price !== item.prices.sale_price) {
        let reg = parseFloat(item.prices.regular_price);
        if (minor > 0) reg = reg / Math.pow(10, minor);
        const regFormatted = Number.isInteger(reg) ? reg.toLocaleString('en-US') : reg.toLocaleString('en-US');
        return `AED ${formatted} <span style="text-decoration:line-through; color:#94A3B8; font-size:11px; margin-left:4px; font-weight:500;">AED ${regFormatted}</span>`;
      }
      return `AED ${formatted}`;
    }

    if (item.price) {
      const clean = String(item.price).replace(/AED/gi, '').trim();
      return "AED " + clean;
    }

    return "AED Contact";
  }

  // 4. Fetch Products Dynamically from WooCommerce Backend for Category 125 ("Detections")
  async function loadDetectionProducts() {
    let products = [];

    try {
      // Direct query to WooCommerce Store API for Category 125 (Detections)
      const storeApiUrl = detectEnv.siteBase + '/wp-json/wc/store/v1/products?category=125&per_page=15';
      const res = await fetch(storeApiUrl, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          products = data
            // Filter out any corrupted test items
            .filter(function(item) {
              const priceStr = String(item.prices ? item.prices.price : "");
              return priceStr.length < 8;
            })
            .map(function(item) {
              // Prefer finding a detection category name, or default to Detections
              let catName = "Detections";
              if (item.categories && item.categories.length > 0) {
                const detCat = item.categories.find(c => c.name.toLowerCase().includes('detector') || c.name.toLowerCase().includes('detection'));
                catName = detCat ? detCat.name : item.categories[0].name;
              }

              return {
                id: item.id,
                name: item.name,
                category: catName,
                price: formatDetectPrice(item),
                image: (item.images && item.images[0]) ? item.images[0].src : "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP730-2P.jpg",
                link: item.permalink || (detectEnv.siteBase + '/?p=' + item.id)
              };
            });
        }
      }
    } catch (err) {
      console.warn("Store API query error:", err);
    }

    if (products.length === 0) {
      products = detectDefaultCatalog;
    }

    renderDetectionProducts(products);
  }

  // 5. Render Products
  function renderDetectionProducts(items) {
    const grid = document.getElementById('detect-product-grid');
    if (!grid) return;
    grid.innerHTML = '';

    items.forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'detect-card';
      card.innerHTML = `
        <div>
          <a href="${item.link}" class="detect-img-link" title="${item.name}">
            <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP730-2P.jpg'">
          </a>
          <div class="detect-category">${item.category}</div>
          <a href="${item.link}" class="detect-product-title" title="${item.name}">${item.name}</a>
          <div class="detect-price">${item.price}</div>
        </div>

        <div id="detect-action-${item.id}">
          <a href="?add-to-cart=${item.id}" data-quantity="1" class="button product_type_simple add_to_cart_button ajax_add_to_cart detect-add-btn" data-product_id="${item.id}" onclick="detectAddToCart(${item.id}, '${item.name.replace(/'/g, "\\'")}', this, event)">
            <span>Add to cart</span>
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // 6. Navigation
  function detectScroll(dir) {
    const container = document.getElementById('detect-carousel-container');
    if (container) {
      const scrollAmount = container.clientWidth * 0.82;
      container.scrollBy({ left: dir * scrollAmount, behavior: 'smooth' });
    }
  }

  // 7. WooCommerce AJAX Add to Cart & Flow Transition
  async function detectAddToCart(productId, productName, btn, event) {
    event.preventDefault();
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.innerHTML = "<span>Adding...</span>";

    try {
      const params = new URLSearchParams();
      params.append('product_id', productId);
      params.append('quantity', '1');

      const response = await fetch(detectEnv.ajaxEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: params.toString(),
        credentials: 'include'
      });

      if (response.ok && window.jQuery) {
        window.jQuery(document.body).trigger('wc_fragment_refresh');
        window.jQuery(document.body).trigger('added_to_cart', [null, null, window.jQuery(btn)]);
      }
    } catch (e) {
      console.log(e);
    }

    const actionWrap = document.getElementById('detect-action-' + productId);
    if (actionWrap) {
      actionWrap.innerHTML = `
        <div class="detect-cart-flow">
          <a href="${detectEnv.cartUrl}" class="detect-go-cart-btn"><span>Go to cart</span> &rarr;</a>
          <div class="detect-check-badge" title="Added to cart">✓</div>
        </div>
      `;
    }

    // Floating toast feedback
    const toast = document.getElementById('detect-toast');
    const msg = document.getElementById('detect-toast-msg');
    if (toast && msg) {
      msg.textContent = productName + " added to cart";
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      setTimeout(function() {
        toast.style.transform = 'translateY(100px)';
        toast.style.opacity = '0';
      }, 3500);
    }
  }

  // Initialize
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadDetectionProducts);
  } else {
    loadDetectionProducts();
  }
</script>
