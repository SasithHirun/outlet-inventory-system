<!-- ==========================================================================
     PACIFIC POWER & FIRE CONTRACTORS - "DEAL OF THE DAY" MINIMALIST SECTION
     - 100% Native WooCommerce Cart Compatible (AJAX + Session Cookies + Mini-Cart sync)
     - Automatically handles subdirectory paths (e.g., /demo/pacificpowerfirecontractors/)
     - Dynamic backend fetching with WooCommerce Store API
     - Seamless transition to "Go to Cart →" upon addition
     ========================================================================== -->

<style>
  /* ================= MINIMALIST SCOPED STYLES ================= */
  .dotd-section,
  .dotd-section * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .dotd-section {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #111827;
    background: #FFFFFF;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header */
  .dotd-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid #F3F4F6;
  }

  .dotd-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dotd-flame {
    font-size: 18px;
    line-height: 1;
  }

  .dotd-title {
    font-size: 20px;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.01em;
  }

  /* Arrow Controls */
  .dotd-arrows {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dotd-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #E5E7EB;
    background: #FFFFFF;
    color: #4B5563;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .dotd-nav-btn:hover {
    border-color: #9CA3AF;
    color: #111827;
  }

  .dotd-nav-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2.2;
    fill: none;
  }

  /* Carousel */
  .dotd-carousel {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .dotd-carousel::-webkit-scrollbar {
    display: none;
  }

  /* Product Card */
  .dotd-card {
    flex: 0 0 230px;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .dotd-card:hover {
    border-color: #D1D5DB;
    transform: translateY(-2px);
  }

  /* Image Container */
  .dotd-img-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 170px;
    background: #FFFFFF;
    border: 1px solid #F9FAFB;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    text-decoration: none;
  }

  .dotd-img-link img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform 0.25s ease;
  }

  .dotd-card:hover .dotd-img-link img {
    transform: scale(1.04);
  }

  /* Meta & Typography */
  .dotd-category {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9CA3AF;
    margin-bottom: 4px;
  }

  .dotd-product-title {
    font-size: 13px;
    font-weight: 500;
    color: #1F2937;
    line-height: 1.4;
    height: 36px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
    text-decoration: none;
  }

  .dotd-product-title:hover {
    color: #DC2626;
  }

  .dotd-price {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 12px;
  }

  /* Native WooCommerce Button Wrapper */
  .dotd-btn-wrap {
    min-height: 36px;
  }

  /* Clean Add to Cart Button (Compatible with WooCommerce ajax_add_to_cart) */
  .dotd-add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 9px 12px;
    background: #DC2626 !important;
    color: #FFFFFF !important;
    border: none !important;
    border-radius: 6px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    line-height: 1 !important;
    text-align: center;
    text-decoration: none !important;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dotd-add-btn:hover {
    background: #B91C1C !important;
    color: #FFFFFF !important;
  }

  .dotd-add-btn.loading {
    opacity: 0.75;
    pointer-events: none;
  }

  /* Clean "Go to Cart" state */
  .dotd-cart-flow {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    animation: dotdFadeIn 0.25s ease;
  }

  @keyframes dotdFadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dotd-go-cart-btn {
    flex: 1;
    padding: 9px 10px;
    background: #111827 !important;
    color: #FFFFFF !important;
    border-radius: 6px;
    font-size: 12px !important;
    font-weight: 600 !important;
    text-align: center;
    text-decoration: none !important;
    transition: background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    line-height: 1;
  }

  .dotd-go-cart-btn:hover {
    background: #1F2937 !important;
  }

  .dotd-check-badge {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    color: #16A34A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Toast Notification */
  .dotd-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #111827;
    color: #FFFFFF;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 999999;
  }

  .dotd-toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .dotd-toast a {
    color: #F87171;
    text-decoration: underline;
    font-weight: 600;
  }
</style>

<div class="dotd-section">
  <!-- Minimalist Header -->
  <div class="dotd-header">
    <div class="dotd-title-wrap">
      <span class="dotd-flame">🔥</span>
      <h2 class="dotd-title">Deal Of The Day</h2>
    </div>

    <!-- Minimalist Arrow Navigation -->
    <div class="dotd-arrows">
      <button class="dotd-nav-btn" onclick="dotdSlide(-1)" aria-label="Previous Products">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button class="dotd-nav-btn" onclick="dotdSlide(1)" aria-label="Next Products">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- Dynamic Product Carousel -->
  <div class="dotd-carousel" id="dotd-carousel">
    <!-- Populated dynamically via JavaScript backend fetch -->
  </div>
</div>

<!-- Floating Toast -->
<div id="dotd-toast" class="dotd-toast">
  <span id="dotd-toast-msg">Item added to cart</span>
  <a id="dotd-toast-cart-link" href="/cart/">Go to Cart &rarr;</a>
</div>

<script>
  // Helper to dynamically detect the accurate WordPress & WooCommerce URLs
  const dotdEnv = (function() {
    // Check if WordPress WooCommerce params are defined on the page
    let cartUrl = "/cart/";
    let ajaxEndpoint = "";
    let siteBase = "";

    if (typeof wc_add_to_cart_params !== 'undefined') {
      if (wc_add_to_cart_params.cart_url) cartUrl = wc_add_to_cart_params.cart_url;
      if (wc_add_to_cart_params.wc_ajax_url) {
        ajaxEndpoint = wc_add_to_cart_params.wc_ajax_url.replace('%%endpoint%%', 'add_to_cart');
      }
      if (wc_add_to_cart_params.ajax_url) {
        siteBase = wc_add_to_cart_params.ajax_url.split('/wp-admin')[0];
      }
    }

    if (!siteBase) {
      // Auto-detect subfolder e.g. /demo/pacificpowerfirecontractors/
      const match = window.location.pathname.match(/^(\/[^\/]+\/[^\/]+)/);
      siteBase = window.location.origin + (match ? match[1] : "");
    }

    if (!ajaxEndpoint) {
      ajaxEndpoint = siteBase + "/?wc-ajax=add_to_cart";
    }

    if (cartUrl === "/cart/" && siteBase) {
      cartUrl = siteBase + "/cart/";
    }

    return {
      siteBase: siteBase,
      ajaxEndpoint: ajaxEndpoint,
      cartUrl: cartUrl
    };
  })();

  // Verified items mapped with real product IDs from your WooCommerce store
  const defaultItems = [
    {
      id: 6251,
      name: "Aico EI3024 Mains Interlinked Optical Smoke & Heat Multi Sensor",
      category: "Fire Products",
      price: "AED 601",
      image: "https://safetag.ae/wp-content/uploads/2024/03/AICO-EI3024-300x300.jpg",
      link: dotdEnv.siteBase + "/product/aico-ei3024/"
    },
    {
      id: 6285,
      name: "Conventional 16 Zone Fire Alarm Control Panel",
      category: "Conventional Panels",
      price: "AED 1,575",
      image: "https://safetag.ae/wp-content/uploads/2024/03/FACP-300x300.jpg",
      link: dotdEnv.siteBase + "/product/conventional-16-zone-panel/"
    },
    {
      id: 6287,
      name: "Finder FF CP500 Intelligent Addressable Fire Alarm Call Point",
      category: "Fire Products",
      price: "AED 158",
      image: "https://safetag.ae/wp-content/uploads/2024/03/FF-CP500-300x300.jpg",
      link: dotdEnv.siteBase + "/product/finder-ff-cp500/"
    },
    {
      id: 6291,
      name: "Honeywell BWC2-X O2 Single Gas Detector (2 Year)",
      category: "Detections",
      price: "AED 478",
      image: "https://safetag.ae/wp-content/uploads/2024/03/BWC2-X-O2-300x300.jpg",
      link: dotdEnv.siteBase + "/product/honeywell-bwc2-x/"
    },
    {
      id: 6281,
      name: "Manual Call Point Cover",
      category: "Fire Products",
      price: "AED 168",
      image: "https://safetag.ae/wp-content/uploads/2024/03/Bardic-Cover-300x300.jpg",
      link: dotdEnv.siteBase + "/product/manual-call-point-cover/"
    },
    {
      id: 6295,
      name: "M-Guard MS-803 Conventional Fire Alarm Panel with LCD",
      category: "Control Panels",
      price: "AED 2,150",
      image: "https://safetag.ae/wp-content/uploads/2026/04/M-GUARD-300x300.jpg",
      link: dotdEnv.siteBase + "/product/m-guard-panel/"
    }
  ];

  // 1. Fetch Product Data dynamically from WooCommerce Backend Store API
  async function dotdLoadProducts() {
    const carousel = document.getElementById('dotd-carousel');
    let products = [];

    try {
      const apiUrl = dotdEnv.siteBase + '/wp-json/wc/store/v1/products?per_page=8';
      const response = await fetch(apiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
      if (response.ok) {
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          products = data.map(function(item) {
            let sym = (item.prices && item.prices.currency_symbol) ? item.prices.currency_symbol : "AED ";
            let rawPrice = (item.prices && item.prices.price) ? parseFloat(item.prices.price) : 0;
            const minor = (item.prices && typeof item.prices.currency_minor_unit === 'number') ? item.prices.currency_minor_unit : 0;
            if (minor > 0) {
              rawPrice = rawPrice / Math.pow(10, minor);
            }
            const formattedPrice = Number.isInteger(rawPrice)
              ? rawPrice.toLocaleString('en-US')
              : rawPrice.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            
            return {
              id: item.id,
              name: item.name,
              category: (item.categories && item.categories[0]) ? item.categories[0].name : "Fire Products",
              price: sym.trim() + " " + formattedPrice,
              image: (item.images && item.images[0]) ? item.images[0].src : "https://safetag.ae/wp-content/uploads/2024/03/AICO-EI3024-300x300.jpg",
              link: item.permalink || "#"
            };
          });
        }
      }
    } catch (e) {
      console.log("Using store catalog fallback:", e);
    }

    if (!products || products.length === 0) {
      products = defaultItems;
    }

    // Update toast link with accurate cart URL
    const toastCartLink = document.getElementById('dotd-toast-cart-link');
    if (toastCartLink) toastCartLink.href = dotdEnv.cartUrl;

    // Render Clean Minimalist HTML with native WooCommerce attributes
    carousel.innerHTML = products.map(function(p) {
      return `
        <div class="dotd-card" data-product-id="${p.id}">
          <div>
            <a href="${p.link}" class="dotd-img-link">
              <img src="${p.image}" alt="${p.name}">
            </a>
            <div class="dotd-category">${p.category}</div>
            <a href="${p.link}" class="dotd-product-title" title="${p.name}">
              ${p.name}
            </a>
            <div class="dotd-price">${p.price}</div>
          </div>

          <div class="dotd-btn-wrap" id="dotd-btn-wrap-${p.id}">
            <a href="${dotdEnv.siteBase}/?add-to-cart=${p.id}"
               data-quantity="1"
               class="button product_type_simple add_to_cart_button ajax_add_to_cart dotd-add-btn"
               data-product_id="${p.id}"
               onclick="dotdHandleClick(${p.id}, '${p.name.replace(/'/g, "\\'")}', this, event)">
              Add to cart
            </a>
          </div>
        </div>
      `;
    }).join('');
  }

  // 2. Add to Cart Handler (Full WooCommerce AJAX + Session Support)
  async function dotdHandleClick(productId, name, btn, event) {
    // If WooCommerce native script is active and jQuery handles it, let it proceed;
    // but also ensure our fallback runs reliably across any theme setup
    event.preventDefault();

    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.textContent = "Adding...";

    let addedSuccessfully = false;

    // Try Standard WooCommerce AJAX with form-urlencoded body & cookies
    try {
      const params = new URLSearchParams();
      params.append('product_id', productId);
      params.append('quantity', '1');

      const response = await fetch(dotdEnv.ajaxEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: params.toString(),
        credentials: 'include' // ESSENTIAL: Passes WooCommerce cart session cookies
      });

      if (response.ok) {
        addedSuccessfully = true;
        // Trigger WooCommerce native mini-cart fragment refresh
        if (window.jQuery) {
          window.jQuery(document.body).trigger('wc_fragment_refresh');
          window.jQuery(document.body).trigger('added_to_cart', [null, null, window.jQuery(btn)]);
        }
      }
    } catch (err) {
      console.log("Direct AJAX failed, attempting native fallback:", err);
    }

    // If fetch had a network or CORS issue, fall back to native WooCommerce redirect
    if (!addedSuccessfully && !window.jQuery) {
      window.location.href = dotdEnv.siteBase + "/?add-to-cart=" + productId;
      return;
    }

    // 3. Transform button into "Go to Cart →" + checkmark
    dotdShowAdded(productId, name);
  }

  // Render "Go to Cart" button state
  function dotdShowAdded(productId, name) {
    const wrap = document.getElementById('dotd-btn-wrap-' + productId);
    if (wrap) {
      wrap.innerHTML = `
        <div class="dotd-cart-flow">
          <a href="${dotdEnv.cartUrl}" class="dotd-go-cart-btn">
            <span>Go to Cart</span> &rarr;
          </a>
          <div class="dotd-check-badge" title="Added to cart">✓</div>
        </div>
      `;
    }

    // Show floating toast
    const toast = document.getElementById('dotd-toast');
    const msg = document.getElementById('dotd-toast-msg');
    if (toast && msg) {
      msg.textContent = name + " added to cart";
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 3500);
    }
  }

  // Listen to native WooCommerce jQuery event if active on page
  if (typeof jQuery !== 'undefined') {
    jQuery(document.body).on('added_to_cart', function(event, fragments, cart_hash, $button) {
      if ($button && $button.length) {
        const id = $button.attr('data-product_id');
        if (id) {
          dotdShowAdded(id, "Item");
        }
      }
    });
  }

  // Scroll carousel left/right
  function dotdSlide(direction) {
    const carousel = document.getElementById('dotd-carousel');
    if (carousel) {
      carousel.scrollBy({ left: 250 * direction, behavior: 'smooth' });
    }
  }

  // Run on load
  document.addEventListener('DOMContentLoaded', dotdLoadProducts);
  dotdLoadProducts();
</script>
