<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Equipment Banner - Full Width (Increased Height)</title>

  <!-- Google Fonts: Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    /* ================= FULL WIDTH BANNER CONTAINER ================= */
    .safety-banner-wrapper {
      width: 100% !important;
      max-width: 100% !important;
      margin: 30px 0 !important;
      padding: 0 !important;
      box-sizing: border-box;
    }

    .safety-banner {
      position: relative;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 400px; /* Increased from 240px for a more spacious, prominent look */
      border-radius: 14px;
      overflow: hidden;
      
      /* Background Image */
      background-image: url('https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/10/Gemini_Generated_Image_dy2byddy2byddy2b-scaled.jpg');
      background-size: cover;
      background-position: center right;
      background-repeat: no-repeat;
      
      display: flex;
      align-items: center;
      padding: 75px 70px; /* Increased vertical padding */
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
    }

    /* ================= CONTRAST GRADIENT OVERLAY ================= */
    .safety-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg, 
        rgba(10, 8, 8, 0.88) 0%, 
        rgba(10, 8, 8, 0.72) 35%, 
        rgba(10, 8, 8, 0.35) 55%, 
        rgba(10, 8, 8, 0.0) 80%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* ================= TEXT CONTENT (STRICT LATO) ================= */
    .banner-text-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    .banner-heading {
      color: #ffffff;
      font-family: 'Lato', sans-serif !important;
      font-size: 38px; /* Slightly scaled up for the taller height */
      line-height: 1.35;
      font-weight: 400;
      letter-spacing: -0.3px;
      margin-bottom: 14px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .banner-heading strong {
      font-family: 'Lato', sans-serif !important;
      font-weight: 900 !important;
      color: #ffffff;
    }

    .banner-description {
      color: #ffffff;
      font-family: 'Lato', sans-serif !important;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.45;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      margin: 0;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1024px) {
      .safety-banner {
        min-height: 330px;
        padding: 55px 45px;
      }
      .banner-heading {
        font-size: 30px;
      }
      .banner-description {
        font-size: 19px;
      }
    }

    @media (max-width: 768px) {
      .safety-banner {
        min-height: 270px;
        padding: 45px 30px;
      }
      .banner-heading {
        font-size: 24px;
      }
      .banner-description {
        font-size: 16px;
      }
      .safety-banner::before {
        background: linear-gradient(
          90deg, 
          rgba(10, 8, 8, 0.92) 0%, 
          rgba(10, 8, 8, 0.78) 65%, 
          rgba(10, 8, 8, 0.40) 100%
        );
      }
    }
  </style>
</head>
<body>

  <div class="safety-banner-wrapper">
    <div class="safety-banner">
      <div class="banner-text-content">
        <h2 class="banner-heading">
          SHOP & SAVE BIG on Essential <strong>Fire</strong><br>
          <strong>Safety Equipment!</strong>
        </h2>
        <p class="banner-description">
          Don't wait for an emergency to get prepared.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
