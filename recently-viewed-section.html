<style>
  /* Prevent horizontal scrollbars from 100vw breakout */
  html, body {
    overflow-x: clip;
  }

  /* ================= SCOPED RESET & STYLING ================= */
  .rv-section-wrapper,
  .rv-section-wrapper * {

  /* 100vw Full-Width Breakout */
  .rv-section-wrapper {
    position: relative;
    width: 100vw;
    max-width: 100vw;

    color: #475569;

    align-items: center;
    justify-content: center;

  .rv-nav-btn:hover {

  .rv-nav-btn svg {

  /* Responsive Breakpoints */

<script>
  // 1. Dynamic Environment Detection
  const rvEnv = (function() {
    let cartUrl = "/cart/";
    let ajaxEndpoint = "";
    let siteBase = "";

    if (typeof wc_add_to_cart_params !== 'undefined') {
      if (wc_add_to_cart_params.cart_url) cartUrl = wc_add_to_cart_params.cart_url;
      if (wc_add_to_cart_params.wc_ajax_url) {
        ajaxEndpoint = wc_add_to_cart_params.wc_ajax_url.replace('%%endpoint%%', 'add_to_cart');
      }
      if (wc_add_to_cart_params.ajax_url) {
        siteBase = wc_add_to_cart_params.ajax_url.split('/wp-admin')[0];
      }
    }

    if (!siteBase) {
      const match = window.location.pathname.match(/^(\/[^\/]+\/[^\/]+)/);
      siteBase = window.location.origin + (match ? match[1] : "");
    }

    if (!ajaxEndpoint) ajaxEndpoint = siteBase + "/?wc-ajax=add_to_cart";
    if (cartUrl === "/cart/" && siteBase) cartUrl = siteBase + "/cart/";

    const toastLink = document.getElementById('rv-toast-cart-link');
    if (toastLink) toastLink.href = cartUrl;

    return { siteBase: siteBase, ajaxEndpoint: ajaxEndpoint, cartUrl: cartUrl };
  })();

  // 2. Accurate Price Formatter: Correctly preserves integer AED prices (315 -> AED 315, not 3.15)
  function formatRVPrice(item) {
    if (item.prices && item.prices.price) {
      let raw = parseFloat(item.prices.price);
      const minor = (typeof item.prices.currency_minor_unit === 'number') ? item.prices.currency_minor_unit : 0;
      if (minor > 0) raw = raw / Math.pow(10, minor);

      const formatted = Number.isInteger(raw)
        ? raw.toLocaleString('en-US')
        : raw.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

      if (item.prices.regular_price && item.prices.sale_price && item.prices.regular_price !== item.prices.sale_price) {
        let reg = parseFloat(item.prices.regular_price);
        if (minor > 0) reg = reg / Math.pow(10, minor);
        const regFormatted = Number.isInteger(reg) ? reg.toLocaleString('en-US') : reg.toLocaleString('en-US');
        return `AED ${formatted} <span style="text-decoration:line-through; color:#94A3B8; font-size:11px; margin-left:4px; font-weight:500;">AED ${regFormatted}</span>`;
      }
      return `AED ${formatted}`;
    }

    if (item.price) {
      const clean = String(item.price).replace(/AED/gi, '').trim();
      return "AED " + clean;
    }

    return "AED 0";
  }

  // 3. Fallback Catalog (Loaded only if fresh visitor has no localStorage history and API is pending)
  const rvDefaultCatalog = [
    {
      id: 7513,
      name: "Ziton ZP730-2P Optical Smoke Detector Analogue Addressable – Polar White",
      category: "Addressable Smoke Detectors",
      price: "AED 315",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP730-2P.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp730-2p/"
    },
    {
      id: 7511,
      name: "Ziton ZP886R ZP7 Series Intelligent Addressable Manual Call Point – Red",
      category: "Fire Products",
      price: "AED 420",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP886R.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp886r/"
    },
    {
      id: 7509,
      name: "Ziton ZP755HAV-2R Sounder Beacon – Wall Mounted",
      category: "Fire Products",
      price: "AED 609",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP755HAV-2R.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp755hav-2r/"
    },
    {
      id: 7507,
      name: "Ziton ZP732-2P Combination Smoke and Heat Sensor – Polar White",
      category: "Addressable Heat Detectors",
      price: "AED 315",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP732-2P.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp732-2p/"
    },
    {
      id: 7505,
      name: "Ziton ZP720-3P Heat Detector Analogue Addressable – Polar White",
      category: "Addressable Heat Detectors",
      price: "AED 315",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP720-3P.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp720-3p/"
    },
    {
      id: 7503,
      name: "Ziton ZP7-SB1-P Detector Surface Base – Polar White",
      category: "Addressable Bases",
      price: "AED 37",
      image: "https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP7-SB1-P.jpg",
      link: rvEnv.siteBase + "/product/ziton-zp7-sb1-p/"
    }
  ];

  // 4. Load Products dynamically from Backend / localStorage
  async function rvLoadProducts() {
    let products = [];

    // Check localStorage first
    try {
      const stored = localStorage.getItem('ppf_recently_viewed');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          products = parsed;
        }
      }
    } catch (e) {
      console.warn("Storage read error:", e);
    }

    // If no local history, fetch live detection products directly from WooCommerce Store API
    if (products.length === 0) {
      try {
        const storeApiUrl = rvEnv.siteBase + '/wp-json/wc/store/v1/products?category=125&per_page=12';
        const res = await fetch(storeApiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            products = data
              .filter(item => String(item.prices ? item.prices.price : "").length < 8)
              .map(function(item) {
                let cat = "Detections";
                if (item.categories && item.categories.length > 0) {
                  const detCat = item.categories.find(c => c.name.toLowerCase().includes('detector') || c.name.toLowerCase().includes('detection'));
                  cat = detCat ? detCat.name : item.categories[0].name;
                }
                return {
                  id: item.id,
                  name: item.name,
                  category: cat,
                  price: formatRVPrice(item),
                  image: (item.images && item.images[0]) ? item.images[0].src : "",
                  link: item.permalink || (rvEnv.siteBase + '/?p=' + item.id)
                };
              });
          }
        }
      } catch (err) {
        console.warn("Store API query error:", err);
      }
    }

    if (products.length === 0) {
      products = rvDefaultCatalog;
    }

    renderRVProducts(products);
  }

  // 5. Render Cards Matching the Reference Design
  function renderRVProducts(items) {
    const grid = document.getElementById('rv-product-grid');
    if (!grid) return;
    grid.innerHTML = '';

    items.forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'rv-card';
      card.innerHTML = `
        <div>
          <a href="${item.link}" class="rv-img-link" title="${item.name}">
            <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='https://infobahndubai.com/demo/pacificpowerfirecontractors/wp-content/uploads/2026/04/Ziton-ZP730-2P.jpg'">
          </a>
          <div class="rv-category">${item.category}</div>
          <a href="${item.link}" class="rv-product-title" title="${item.name}">${item.name}</a>
          <div class="rv-price">${item.price}</div>
        </div>

        <div id="rv-action-${item.id}">
          <a href="?add-to-cart=${item.id}" data-quantity="1" class="button product_type_simple add_to_cart_button ajax_add_to_cart rv-add-btn" data-product_id="${item.id}" onclick="rvAddToCart(${item.id}, '${item.name.replace(/'/g, "\\'")}', this, event)">
            <span>Add to cart</span>
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // 6. Scroll Navigation
  function rvScroll(dir) {
    const container = document.getElementById('rv-carousel-container');
    if (container) {
      const scrollAmount = container.clientWidth * 0.82;
      container.scrollBy({ left: dir * scrollAmount, behavior: 'smooth' });
    }
  }

  // 7. WooCommerce AJAX Add to Cart & Flow Transition
  async function rvAddToCart(productId, productName, btn, event) {
    event.preventDefault();
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.innerHTML = "<span>Adding...</span>";

    try {
      const params = new URLSearchParams();
      params.append('product_id', productId);
      params.append('quantity', '1');

      const response = await fetch(rvEnv.ajaxEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: params.toString(),
        credentials: 'include'
      });

      if (response.ok && window.jQuery) {
        window.jQuery(document.body).trigger('wc_fragment_refresh');
        window.jQuery(document.body).trigger('added_to_cart', [null, null, window.jQuery(btn)]);
      }
    } catch (e) {
      console.log(e);
    }

    const actionWrap = document.getElementById('rv-action-' + productId);
    if (actionWrap) {
      actionWrap.innerHTML = `
        <div class="rv-cart-flow">
          <a href="${rvEnv.cartUrl}" class="rv-go-cart-btn"><span>Go to cart</span> &rarr;</a>
          <div class="rv-check-badge" title="Added to cart">✓</div>
        </div>
      `;
    }

    // Show floating toast
    const toast = document.getElementById('rv-toast');
    const msg = document.getElementById('rv-toast-msg');
    if (toast && msg) {
      msg.textContent = productName + " added to cart";
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      setTimeout(function() {
        toast.style.transform = 'translateY(100px)';
        toast.style.opacity = '0';
      }, 3500);
    }
  }

  // Auto-record product view if on single product page
  (function trackSingleProduct() {
    if (document.body.classList.contains('single-product')) {
      const idInput = document.querySelector('input[name="add-to-cart"]');
      const titleElem = document.querySelector('.product_title');
      const priceElem = document.querySelector('.woocommerce-Price-amount');
      const imgElem = document.querySelector('.woocommerce-product-gallery__image img');

      if (idInput && titleElem) {
        const currentItem = {
          id: idInput.value,
          name: titleElem.textContent.trim(),
          category: "Fire Products",
          price: priceElem ? priceElem.textContent.trim() : "AED Contact",
          image: imgElem ? imgElem.src : "",
          link: window.location.href
        };

        try {
          let recents = JSON.parse(localStorage.getItem('ppf_recently_viewed') || '[]');
          recents = recents.filter(p => String(p.id) !== String(currentItem.id));
          recents.unshift(currentItem);
          if (recents.length > 12) recents = recents.slice(0, 12);
          localStorage.setItem('ppf_recently_viewed', JSON.stringify(recents));
        } catch(e) {}
      }
    }
  })();

  // Initialize
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', rvLoadProducts);
  } else {
    rvLoadProducts();
  }
</script>
