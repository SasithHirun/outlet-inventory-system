<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>චූටිගේ පවුල - Chuti's Family Storybook</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap');

        body {
            font-family: 'Noto Sans Sinhala', 'Nirmala UI', sans-serif;
            background: #1e1914;
            margin: 0;
            padding: 30px 15px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: #f7ecd5;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 2.4rem;
            color: #ffd885;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
        }

        header p {
            margin: 4px 0;
            font-size: 1.15rem;
            color: #e6dac3;
        }

        .controls {
            margin: 20px 0 30px;
        }

        .btn-print {
            background: #d4a359;
            color: #2b1f13;
            border: none;
            padding: 14px 30px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: transform 0.15s, background 0.15s;
        }

        .btn-print:hover {
            background: #eed088;
            transform: translateY(-2px);
        }

        .book-container {
            display: flex;
            flex-direction: column;
            gap: 45px;
            max-width: 860px;
            width: 100%;
        }

        .page-card {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            page-break-after: always;
            break-after: page;
        }

        .page-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .page-info {
            background: #2a221b;
            padding: 12px 24px;
            text-align: right;
            font-size: 0.95rem;
            color: #d1b894;
            font-weight: 600;
            border-top: 1px solid #3d3126;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            header, .controls, .page-info {
                display: none !important;
            }
            .book-container {
                gap: 0;
                max-width: 100%;
            }
            .page-card {
                box-shadow: none;
                border-radius: 0;
                page-break-after: always;
                break-after: page;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>චූටිගේ පවුල</h1>
        <p><strong>කතුවරිය:</strong> වර්ෂා දසනායක (පන්තිය: 5-C)</p>
        <div class="controls">

        </div>
    </header>

            <div class="page-info">කවරය (Cover Page)</div>
