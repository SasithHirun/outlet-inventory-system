  /* Prevent horizontal scrollbars from 100vw breakout */

  /* Multi-Row Carousel (5 per row on desktop) */

  /* Shimmer Skeleton */

    animation: bsShimmer 1.5s infinite;

  @keyframes bsShimmer {

  /* Responsive Breakpoints */

    .bs-grid {

<script>
  // Dynamic Environment Detection
  const bsEnv = (function() {
    let cartUrl = "/cart/";
    let ajaxEndpoint = "";
    let siteBase = "";

    if (typeof wc_add_to_cart_params !== 'undefined') {
      if (wc_add_to_cart_params.cart_url) cartUrl = wc_add_to_cart_params.cart_url;
      if (wc_add_to_cart_params.wc_ajax_url) {
        ajaxEndpoint = wc_add_to_cart_params.wc_ajax_url.replace('%%endpoint%%', 'add_to_cart');
      }
      if (wc_add_to_cart_params.ajax_url) {
        siteBase = wc_add_to_cart_params.ajax_url.split('/wp-admin')[0];
      }
    }

    if (!siteBase) {
      const match = window.location.pathname.match(/^(\/[^\/]+\/[^\/]+)/);
      siteBase = window.location.origin + (match ? match[1] : "");
    }

    if (!ajaxEndpoint) ajaxEndpoint = siteBase + "/?wc-ajax=add_to_cart";
    if (cartUrl === "/cart/" && siteBase) cartUrl = siteBase + "/cart/";

    return { siteBase: siteBase, ajaxEndpoint: ajaxEndpoint, cartUrl: cartUrl };
  })();

  // Robust Price Formatter: Properly handles integer AED prices without unwanted division
  function formatProductPrice(item) {
    if (item.prices && item.prices.price) {
      let raw = parseFloat(item.prices.price);
      
      // In this WooCommerce backend, currency_minor_unit is 0. 
      // Only divide if minor unit is explicitly a positive number greater than 0
      const minor = (typeof item.prices.currency_minor_unit === 'number') ? item.prices.currency_minor_unit : 0;
      if (minor > 0) {
        raw = raw / Math.pow(10, minor);
      }
      
      const formatted = Number.isInteger(raw)
        ? raw.toLocaleString('en-US')
        : raw.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      
      // Check for sale discount
      if (item.prices.regular_price && item.prices.sale_price && item.prices.regular_price !== item.prices.sale_price) {
        let reg = parseFloat(item.prices.regular_price);
        if (minor > 0) reg = reg / Math.pow(10, minor);
        const regFormatted = Number.isInteger(reg) ? reg.toLocaleString('en-US') : reg.toLocaleString('en-US');
        return `AED ${formatted} <span style="text-decoration:line-through; color:#94A3B8; font-size:11px; margin-left:4px; font-weight:500;">AED ${regFormatted}</span>`;
      }
      
      return `AED ${formatted}`;
    }

    if (item.price) {
      const clean = String(item.price).replace(/AED/gi, '').trim();
      return "AED " + clean;
    }

    return "AED 0";
  }

  // Pure Live Fetch from WordPress Database (No Hardcoding)
  async function bsLoadLiveProducts() {
    const grid = document.getElementById('bs-product-grid');
    let products = [];

    // 1. Fetch from WooCommerce Store API
    try {
      const storeApiUrl = bsEnv.siteBase + '/wp-json/wc/store/v1/products?orderby=popularity&order=desc&per_page=12';
      const res = await fetch(storeApiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
      
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          products = data.map(function(item) {
            return {
              id: item.id,
              name: item.name,
              category: (item.categories && item.categories[0]) ? item.categories[0].name : "Fire Products",
              price: formatProductPrice(item),
              image: (item.images && item.images[0]) ? item.images[0].src : "",
              link: item.permalink || (bsEnv.siteBase + '/?p=' + item.id)
            };
          });
        }
      }
    } catch (e) {
      console.warn("Store API query error:", e);
    }

    // 2. Fallback to WordPress WP REST API
    if (products.length === 0) {
      try {
        const wpApiUrl = bsEnv.siteBase + '/wp-json/wp/v2/product?per_page=12';
        const res = await fetch(wpApiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            products = data.map(function(item) {
              return {
                id: item.id,
                name: item.title ? item.title.rendered : "Product",
                category: "Fire Products",
                price: item.price ? ("AED " + item.price) : "AED Contact",
                image: (item.featured_media_src_url || ""),
                link: item.link
              };
            });
          }
        }
      } catch (err) {
        console.warn("WP REST API query error:", err);
      }
    }

    // Render Live Backend Products
    if (products.length > 0) {
      renderLiveBestSellers(products);
    } else if (grid) {
      grid.innerHTML = `
        <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: #64748B;">
          <p style="font-size: 15px; font-weight: 600; margin-bottom: 6px;">Connected to WordPress Backend</p>
          <p style="font-size: 13px;">No published products found in your catalog. Please ensure products are published in WP Admin &gt; Products.</p>
        </div>
      `;
    }
  }

  function renderLiveBestSellers(items) {
    const grid = document.getElementById('bs-product-grid');
    if (!grid) return;
    grid.innerHTML = '';

    items.forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'bs-card';
      card.innerHTML = `
        <div class="bs-card-top">
          <div class="bs-category">${item.category}</div>
          <a href="${item.link}" class="bs-product-title" title="${item.name}">${item.name}</a>
        </div>
        
        <a href="${item.link}" class="bs-img-link" title="${item.name}">
          ${item.image ? `<img src="${item.image}" alt="${item.name}" loading="lazy">` : `<div style="color:#94A3B8; font-size:12px;">No Image</div>`}
        </a>

        <div class="bs-bottom-bar">
          <div class="bs-price">${item.price}</div>
          <div id="bs-action-${item.id}">
            <a href="?add-to-cart=${item.id}" data-quantity="1" class="button product_type_simple add_to_cart_button ajax_add_to_cart bs-add-btn" data-product_id="${item.id}" onclick="bsAddToCart(${item.id}, '${item.name.replace(/'/g, "\\'")}', this, event)">
              <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              <span>Add</span>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function bsScroll(dir) {
    const container = document.getElementById('bs-carousel-container');
    if (container) {
      const scrollAmount = container.clientWidth * 0.85;
      container.scrollBy({ left: dir * scrollAmount, behavior: 'smooth' });
    }
  }

  async function bsAddToCart(productId, productName, btn, event) {
    event.preventDefault();
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.innerHTML = "<span>...</span>";

    try {
      const params = new URLSearchParams();
      params.append('product_id', productId);
      params.append('quantity', '1');

      const response = await fetch(bsEnv.ajaxEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: params.toString(),
        credentials: 'include'
      });

      if (response.ok && window.jQuery) {
        window.jQuery(document.body).trigger('wc_fragment_refresh');
        window.jQuery(document.body).trigger('added_to_cart', [null, null, window.jQuery(btn)]);
      }
    } catch (e) {
      console.log(e);
    }

    const actionWrap = document.getElementById('bs-action-' + productId);
    if (actionWrap) {
      actionWrap.innerHTML = `
        <div class="bs-cart-flow">
          <a href="${bsEnv.cartUrl}" class="bs-go-cart-btn"><span>Cart</span> &rarr;</a>
          <div class="bs-check-badge" title="Added to cart">✓</div>
        </div>
      `;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bsLoadLiveProducts);
  } else {
    bsLoadLiveProducts();
  }
</script>
